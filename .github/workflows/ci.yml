  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # needs: test-api
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd ${{ secrets.APP_PATH }}

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/staging

            echo "Validating docker compose..."
            docker compose -f deployments/docker.compose.dev.yml config

            echo "Building & restarting services..."
            docker compose -f deployments/docker.compose.dev.yml up --build -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Staging deploy successful!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # needs: test-api
    if: github.ref == 'refs/heads/trunk'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd ${{ secrets.APP_PATH }}

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/trunk

            echo "Validating docker compose..."
            docker compose -f deployments/docker.compose.prod.yml config

            echo "Building & restarting services..."
            docker compose -f deployments/docker.compose.prod.yml up --build -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Production deploy successful!"
